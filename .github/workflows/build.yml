name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test tests/DevConverter.Core.Tests/DevConverter.Core.Tests.csproj --configuration Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish PowerToys plugin
        run: dotnet publish Community.PowerToys.Run.Plugin.DevConvert.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o publish/DevConverter
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/DevConverter -DestinationPath DevConverter-PowerToysRun-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DevConverter-PowerToysRun-x64
          path: DevConverter-PowerToysRun-x64.zip

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            asset: DevConverter-macos-arm64.zip
          - rid: osx-x64
            asset: DevConverter-macos-x64.zip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish shared-core CLI
        run: dotnet publish src/DevConverter.Cli/DevConverter.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/cli
      - name: Build Spotlight App Intent host
        run: |
          xcodebuild \
            -project macos/DevConverterSpotlight/DevConverterSpotlight.xcodeproj \
            -scheme DevConverterSpotlight \
            -configuration Release \
            -derivedDataPath publish/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Embed CLI and package
        run: |
          app='publish/DerivedData/Build/Products/Release/DevConverter Spotlight.app'
          cp publish/cli/devconvert "$app/Contents/Resources/devconvert"
          chmod +x "$app/Contents/Resources/devconvert"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" '${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
